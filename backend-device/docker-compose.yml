# The go-link device in Docker (Linux host). Build and start:
#   docker compose up -d --build
# (or use the published image: ghcr.io/lordbasex/go-link-console:latest)
# The web panel is then at http://<this computer's LAN address>:7373 and
# asks for its token:
#   docker compose exec device go-link-console panel token --config /data/device.json
services:
  device:
    build:
      context: .
      dockerfile: build/docker.Dockerfile
    image: go-link-console
    restart: unless-stopped
    # WebRTC needs UDP straight to the players: the host's network is the
    # simple way. Without it, see "Docker without host network" in the README.
    network_mode: host
    volumes:
      # Configuration, the core, saved games and history.
      - go-link-data:/data
      # Your ROM sets (MAME 2003-Plus / 0.78). Writable, so ROMs dropped
      # in the web panel can be added (":ro" to keep the folder read-only).
      - ./roms:/data/go-link-console/roms
      # Your thumbnails, libretro layout: Named_Boxarts, Named_Titles,
      # Named_Snaps (":ro" if you only add them by hand).
      - ./thumbnails:/data/go-link-console/thumbnails/MAME
    # go-link HD rooms in H.264 from the graphics card (else VP8). Intel or
    # AMD: give it the card, and the group that owns it on this computer
    # (the number from `stat -c %g /dev/dri/renderD128`):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "109"
    # NVIDIA (with the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
volumes:
  go-link-data:
