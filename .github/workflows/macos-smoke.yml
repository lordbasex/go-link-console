# Checks the released macOS app on Apple silicon: GitHub's macOS runners
# are ARM Macs, so the universal .dmg's arm64 half runs natively here (a
# release is built on an Intel Mac, which cannot run it). It mounts the
# .dmg, checks both slices, runs the app's CLI and downloads the emulator
# core, which also proves the network code works on arm64.
name: macos-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (e.g. v0.1.2)
        required: true

permissions:
  contents: read

jobs:
  apple-silicon:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the release's .dmg
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-macos-universal.dmg' --dir .
      - name: Mount it and check the app
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          hdiutil attach -nobrowse -mountpoint /tmp/go-link-dmg ./*-macos-universal.dmg
          cp -R /tmp/go-link-dmg/go-link-console.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/go-link-dmg
          BIN="$RUNNER_TEMP/go-link-console.app/Contents/MacOS/go-link-console"
          lipo -archs "$BIN" | tee /dev/stderr | grep -q "arm64"
          lipo -archs "$BIN" | grep -q "x86_64"
          otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep -q "minos 12.0"
          # Only system libraries: libvpx and Opus are linked in.
          ! otool -L "$BIN" | grep -E "homebrew|/usr/local|/opt/"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Run it on arm64
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          # --help exits with 2 (Go's flag package): only its text matters.
          arch -arm64 "$BIN" --help > help.txt 2>&1 || true
          cat help.txt
          grep -q "go-link device $TAG" help.txt
          arch -arm64 "$BIN" core download
          ls -la "$HOME/go-link-console/cores/"
          test -s "$HOME/go-link-console/cores/mame2003_plus.romcheck"
