# XcodeGen spec: `make project` (or `xcodegen generate`) writes GoLinkPlayer.xcodeproj,
# which is not committed. Signing comes from Config/Local.xcconfig (gitignored).
name: GoLinkPlayer
options:
  bundleIdPrefix: org.golink
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GoLinkCore:
    path: GoLinkCore
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  GoLinkPlayer:
    type: application
    platform: iOS
    sources:
      - path: GoLinkPlayer
      # The built-in gamepad skins, shared with the Android app (docs/skins/README.md).
      - path: ../../docs/skins/builtin
        buildPhase: resources
    dependencies:
      - package: GoLinkCore
      - package: WebRTC
    info:
      path: GoLinkPlayer/Info.plist
      properties:
        CFBundleDisplayName: go-link Console Player
        CFBundleName: go-link Console Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: go-link Console Player uses the camera only to read the invitation's QR code. Nothing is recorded or sent.
        NSMicrophoneUsageDescription: Seated players can talk to each other. The microphone only sends while you turn it on in the room.
        # ProMotion iPhones: let the room and the controller test ask for 120 Hz
        # (without it iPhones cap CADisplayLink and MTKView at 60).
        CADisableMinimumFrameDurationOnPhone: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
        # The Files app shows the app's Skins folder, where extra gamepad skins go.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.golink.player
        CODE_SIGN_ENTITLEMENTS: $(GOLINK_ENTITLEMENTS)
        PRODUCT_NAME: GoLinkPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
  GoLinkPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoLinkPlayerUITests
    dependencies:
      - target: GoLinkPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.golink.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: GoLinkPlayer
schemes:
  GoLinkPlayer:
    build:
      targets:
        GoLinkPlayer: all
        GoLinkPlayerUITests: [test]
    test:
      targets:
        - GoLinkPlayerUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
